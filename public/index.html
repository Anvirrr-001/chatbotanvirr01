<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elonbet Custom Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">🤖</div>
                <div class="bot-details">
                    <h1>ELON সাহায্যকারী</h1>
                    <span class="status">Online</span>
                </div>
            </div>
            <button class="close-btn" title="Close Chat">✕</button>
        </header>

        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Messages and buttons will be injected here -->
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <form id="chatForm">
                <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off">
                <button type="submit" id="sendBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
