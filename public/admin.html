<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-field { background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 0.5rem; padding: 0.75rem; width: 100%; focus: border-blue-500; outline: none; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .card { background: #1e293b; border-radius: 1rem; padding: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-screen" class="max-w-md mx-auto mt-20 p-8 glass rounded-2xl shadow-2xl">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">Admin Login</h1>
        <div class="mb-4">
            <label class="block mb-2 text-sm font-medium">Password</label>
            <input type="password" id="admin-pass" class="input-field" placeholder="Enter admin password">
        </div>
        <button onclick="login()" class="w-full btn-primary mt-4">Login to Dashboard</button>
        <p id="login-error" class="text-red-500 mt-4 text-sm hidden">Incorrect password. Please try again.</p>
    </div>

    <div id="dashboard" class="max-w-6xl mx-auto hidden">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                    Bot Master Dashboard
                </h1>
                <p class="text-gray-400 mt-1">Manage your JivoChat bot responses and settings</p>
            </div>
            <div class="flex gap-4">
                <button onclick="saveConfig()" class="btn-primary">
                    <i class="fas fa-save mr-2"></i> Save Changes
                </button>
                <button onclick="logout()" class="px-6 py-3 bg-red-600 hover:bg-red-700 rounded-lg font-bold transition-all">
                    Logout
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar: Menu List -->
            <div class="lg:col-span-1 space-y-4">
                <div class="card h-full">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold">Menus / Steps</h2>
                        <button onclick="createNewMenu()" class="text-blue-400 hover:text-blue-300"><i class="fas fa-plus-circle text-xl"></i></button>
                    </div>
                    <div id="menu-list-sidebar" class="space-y-2 overflow-y-auto max-h-[600px] pr-2 custom-scrollbar">
                        <!-- List of Menu IDs will appear here -->
                    </div>
                </div>
            </div>

            <!-- Main: Menu Editor -->
            <div class="lg:col-span-3 space-y-6">
                <!-- Global Settings (Bot Name etc.) -->
                <div class="card">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase text-gray-400 mb-1">Bot Name</label>
                            <input type="text" id="bot-name" class="input-field" placeholder="Bot Name">
                        </div>
                        <div>
                            <label class="block text-xs uppercase text-gray-400 mb-1">Welcome Greeting</label>
                            <input type="text" id="welcome-greeting" class="input-field" placeholder="Hello!">
                        </div>
                    </div>
                </div>

                <!-- Active Menu Editor -->
                <div id="menu-editor" class="card hidden border-t-4 border-blue-500">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fas fa-edit mr-3 text-blue-400"></i> Editing: <span id="editing-menu-id" class="ml-2 text-blue-300"></span>
                        </h2>
                        <button onclick="deleteActiveMenu()" id="delete-menu-btn" class="text-red-500 hover:text-red-400 text-sm">
                            <i class="fas fa-trash mr-1"></i> Delete Menu
                        </button>
                    </div>

                    <div class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-1">Menu Type</label>
                                <select id="menu-type" class="input-field" onchange="toggleMenuTypeUI()">
                                    <option value="standard">Standard (Text + Buttons)</option>
                                    <option value="operator">Operator Transfer</option>
                                </select>
                            </div>
                            <div id="initial-menu-toggle-container">
                                <label class="block text-xs font-bold text-gray-400 mb-1">Entry Point?</label>
                                <div class="flex items-center mt-2">
                                    <input type="checkbox" id="is-initial-menu" class="w-5 h-5 rounded cursor-pointer">
                                    <span class="ml-2 text-sm text-gray-300">Set as starting menu</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">Message Text (বট যা বলবে)</label>
                            <textarea id="menu-text-content" rows="4" class="input-field" placeholder="Enter message..."></textarea>
                        </div>

                        <div id="options-section">
                            <div class="flex justify-between items-center mb-4">
                                <label class="block text-xs font-bold text-gray-400">Buttons / Options</label>
                                <button onclick="addOptionRow()" class="text-xs bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded">
                                    <i class="fas fa-plus mr-1"></i> Add Button
                                </button>
                            </div>
                            <div id="options-list" class="space-y-3">
                                <!-- Option rows -->
                            </div>
                        </div>
                    </div>
                </div>

                <div id="no-menu-selected" class="card text-center py-20 bg-opacity-50">
                    <i class="fas fa-mouse-pointer text-5xl text-gray-600 mb-4"></i>
                    <p class="text-gray-400">Please select a menu from the sidebar to edit or create a new one.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Option Row Template -->
    <template id="option-row-template">
        <div class="flex flex-col md:flex-row gap-3 p-4 glass rounded-lg relative group">
            <div class="flex-1">
                <label class="block text-[10px] text-gray-500 uppercase">Button Label</label>
                <input type="text" class="opt-text input-field py-2 text-sm" placeholder="e.g. Deposit">
            </div>
            <div class="flex-1">
                <label class="block text-[10px] text-gray-500 uppercase">Target Menu</label>
                <select class="opt-target input-field py-2 text-sm">
                    <!-- Dynamic menu list -->
                </select>
            </div>
            <div class="flex items-end">
                <button class="remove-option-btn text-gray-600 hover:text-red-500 mb-2">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </template>


    <script src="admin.js"></script>
</body>
</html>
