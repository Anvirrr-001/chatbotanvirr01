<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-field { background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 0.5rem; padding: 0.75rem; width: 100%; focus: border-blue-500; outline: none; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .card { background: #1e293b; border-radius: 1rem; padding: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-screen" class="max-w-md mx-auto mt-20 p-8 glass rounded-2xl shadow-2xl">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">Admin Login</h1>
        <div class="mb-4">
            <label class="block mb-2 text-sm font-medium">Password</label>
            <input type="password" id="admin-pass" class="input-field" placeholder="Enter admin password">
        </div>
        <button onclick="login()" class="w-full btn-primary mt-4">Login to Dashboard</button>
        <p id="login-error" class="text-red-500 mt-4 text-sm hidden">Incorrect password. Please try again.</p>
    </div>

    <div id="dashboard" class="max-w-6xl mx-auto hidden">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                    Bot Master Dashboard
                </h1>
                <p class="text-gray-400 mt-1">Manage your JivoChat bot responses and settings</p>
            </div>
            <div class="flex gap-4">
                <button onclick="saveConfig()" class="btn-primary">
                    <i class="fas fa-save mr-2"></i> Save Changes
                </button>
                <button onclick="logout()" class="px-6 py-3 bg-red-600 hover:bg-red-700 rounded-lg font-bold transition-all">
                    Logout
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Basic Settings -->
            <div class="lg:col-span-1 space-y-6">
                <div class="card">
                    <h2 class="text-xl font-bold mb-6 flex items-center">
                        <i class="fas fa-robot mr-3 text-blue-400"></i> Bot Identity
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Bot Name (প্রোফাইল নাম)</label>
                            <input type="text" id="bot-name" class="input-field" placeholder="e.g. ELON সাহায্যকারী">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Welcome Greeting (স্বাগতম বার্তা)</label>
                            <textarea id="welcome-greeting" rows="3" class="input-field" placeholder="Default greeting text"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Menu Help Text</label>
                            <input type="text" id="menu-text" class="input-field" placeholder="e.g. Select a topic">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2 class="text-xl font-bold mb-6 flex items-center">
                        <i class="fas fa-th-large mr-3 text-purple-400"></i> Initial Buttons
                    </h2>
                    <div id="menu-buttons-list" class="space-y-2 mb-4">
                        <!-- Dynamic Buttons -->
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="new-button-text" class="input-field py-2" placeholder="New button text">
                        <button onclick="addButton()" class="bg-blue-600 p-2 px-4 rounded-lg hover:bg-blue-700">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Keyword Manager -->
            <div class="lg:col-span-2 space-y-6">
                <div class="card h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fas fa-key mr-3 text-green-400"></i> Dynamic Keywords (কিওয়ার্ড উত্তর)
                        </h2>
                        <button onclick="addNewKeyword()" class="bg-green-600 hover:bg-green-700 p-2 px-4 rounded-lg text-sm font-bold">
                            <i class="fas fa-plus mr-1"></i> Add Keyword
                        </button>
                    </div>
                    
                    <div id="keywords-container" class="space-y-4 max-h-[700px] overflow-y-auto pr-2 custom-scrollbar">
                        <!-- Dynamic Keyword cards -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="keyword-template">
        <div class="p-5 glass rounded-xl relative group border border-gray-700 hover:border-blue-500 transition-colors">
            <button class="absolute top-4 right-4 text-gray-500 hover:text-red-500 remove-kw-btn">
                <i class="fas fa-trash"></i>
            </button>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs uppercase text-gray-400 mb-1">Trigger (কিওয়ার্ড)</label>
                    <input type="text" class="kw-trigger input-field text-sm" placeholder="User says this...">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 mb-1">Match Type</label>
                    <select class="kw-match input-field text-sm">
                        <option value="false">Partial Match (ধরে নেবে)</option>
                        <option value="true">Exact Match (পুরো মিল)</option>
                    </select>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-xs uppercase text-gray-400 mb-1">Response Type</label>
                <select class="kw-type input-field text-sm mb-2" onchange="updateKwUI(this)">
                    <option value="text">Just Text Reply</option>
                    <option value="menu">Text + Menu Buttons</option>
                    <option value="operator">Transfer to Operator</option>
                </select>
                <textarea class="kw-text input-field text-sm" rows="2" placeholder="Bot's reply..."></textarea>
            </div>
            <div class="options-container hidden">
                <label class="block text-xs uppercase text-gray-400 mb-1 font-bold text-blue-300">Menu Options (Separate by comma)</label>
                <input type="text" class="kw-options input-field text-sm" placeholder="Option 1, Option 2, Option 3">
            </div>
        </div>
    </template>

    <script src="admin.js"></script>
</body>
</html>
